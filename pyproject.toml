[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "planning-toolbox"
version = "0.5.0"
description = "城乡规划 CAD–GIS 自动化辅助工具箱 (Planning Toolbox)"
readme = "README.md"
authors = [
    { name = "Planning Toolbox Team" }
]
requires-python = ">=3.10"
dependencies = [
    "ezdxf>=1.1.0",
    "shapely>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
planning-toolbox = "planning_toolbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
planning_toolbox = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
