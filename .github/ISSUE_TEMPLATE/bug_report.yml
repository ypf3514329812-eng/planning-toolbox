name: Bug report
description: 报告可复现的软件问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请不要上传真实项目图纸、个人信息或未获授权的规划成果。优先使用合成样例。
  - type: input
    id: version
    attributes:
      label: Planning Toolbox 版本
      placeholder: "0.58.1"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: "Windows 11 / Python 3.13 / SketchUp 2026（如适用）"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供最小、可重复的操作步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 数据确认
      options:
        - label: 我已确认附件不含个人信息、真实项目数据、密钥或来源不明素材。
          required: true
