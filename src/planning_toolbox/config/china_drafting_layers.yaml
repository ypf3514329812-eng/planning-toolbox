# Planning Toolbox 中国规划制图辅助图层库
#
# 重要：以下颜色、线宽和线型是依据常见中国规划/总图表达整理的
# “学习辅助默认值”，不是对所有地区、所有设计院和所有报批阶段都
# 强制适用的全国统一数值。具体项目须服从最新版正式标准、地方规定
# 和学校/设计单位制图要求。

